name: gbemu CI

on: [push]

env:
  CMAKE_VER: 4.4.0
  NINJA_VER: 1.11.1
  LLVM_VER_WIN: 22.1.7
  LLVM_VER_UBUNTU: 22
  GCC_VER: 16
  MSVC_VER: 14.51

jobs:
  # No `ctest`/coverage steps yet: this repo has no test target of its own
  # (see CLAUDE.md - libgbemu's own tests are deliberately not built here,
  # ENABLE_TESTS stays off), and gbemu is a windowed app with nothing
  # exercising it headlessly in CI. Both come back once real tests exist.
  build:
    name: Build (${{ matrix.preset }})
    strategy:
      fail-fast: false
      matrix:
        preset:
          - dev_ninja_clang_tidy
          - dev_ninja_msvc_analysis

    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@65b272e1213f99771fbba0c237e0b3312270e0c9 # v1.13
        with:
          cmake-version: ${{ env.CMAKE_VER }}

      - name: CMake version
        run: cmake --version

      - name: Install Ninja
        uses: seanmiddleditch/gha-setup-ninja@7e868db0f3406270dd46e1dac26c65f621456723 # master
        with:
          version: ${{ env.NINJA_VER }}

      - name: Install LLVM
        run: |
          choco install llvm --version=$env:LLVM_VER_WIN --allow-downgrade
          clang-format --version
          clang-tidy --version

      - name: Update MSVC
        run: |
          Invoke-WebRequest -URI https://aka.ms/vs/stable/vs_buildtools.exe -OutFile vs_buildtools.exe
          $process = Start-Process -FilePath vs_buildtools.exe -ArgumentList "--installPath", "$pwd\VSBuildTools", "--passive", "--wait","--add", "Microsoft.VisualStudio.Component.VC.Tools.x86.x64" -Wait -PassThru
          Write-Output $process.ExitCode

      - name: Setup MSVC dev environment
        uses: TheMrMilchmann/setup-msvc-dev@3cc490970305750dc49f92cfc3a5543976a1d2cc # v2
        with:
          arch: x64
          toolset: ${{ env.MSVC_VER }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Conan
        run: |
          pip install --only-binary :all: conan==2.31.1
          conan profile detect --force

      - name: Install cmake-format
        run: "pip install --only-binary :all: cmake-format==0.6.13"

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Check Formatting
        run: cmake --build --preset ${{ matrix.preset }} --target clang-format-check

      - name: Check CMake Formatting
        run: cmake --build --preset ${{ matrix.preset }} --target cmake-format-check

  build_linux:
    name: Build (${{ matrix.preset }})
    strategy:
      fail-fast: false
      matrix:
        preset:
          - dev_ninja_gcc
          - release_ninja_gcc
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@65b272e1213f99771fbba0c237e0b3312270e0c9 # v1.13
        with:
          cmake-version: ${{ env.CMAKE_VER }}

      - name: CMake version
        run: cmake --version

      - name: Install Ninja
        uses: seanmiddleditch/gha-setup-ninja@7e868db0f3406270dd46e1dac26c65f621456723 # master
        with:
          version: ${{ env.NINJA_VER }}

      - name: Install GCC
        run: |
          sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
          sudo apt-get update
          sudo apt-get install -y gcc-$GCC_VER g++-$GCC_VER
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-$GCC_VER 100
          sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-$GCC_VER 100
          sudo mkdir -p /usr/lib/gcc/x86_64-linux-gnu/include/
          sudo ln -s /usr/include/c++/ /usr/lib/gcc/x86_64-linux-gnu/include/c++
          g++ --version

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Conan
        run: |
          pip install --only-binary :all: conan==2.31.1
          conan profile detect --force

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

  build_linux_clang:
    name: Build (${{ matrix.preset }})
    strategy:
      fail-fast: false
      matrix:
        preset:
          - dev_ninja_clang_linux
          - release_ninja_clang_linux
          - dev_ninja_clang_sanitizers_linux
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@65b272e1213f99771fbba0c237e0b3312270e0c9 # v1.13
        with:
          cmake-version: ${{ env.CMAKE_VER }}

      - name: CMake version
        run: cmake --version

      - name: Install Ninja
        uses: seanmiddleditch/gha-setup-ninja@7e868db0f3406270dd46e1dac26c65f621456723 # master
        with:
          version: ${{ env.NINJA_VER }}

      - name: Install LLVM
        run: |
          wget --max-redirect=0 https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh $LLVM_VER_UBUNTU all
          sudo update-alternatives --remove-all clang || true
          sudo update-alternatives --remove-all clang-format || true
          sudo update-alternatives --remove-all llvm-symbolizer || true
          sudo update-alternatives \
            --install /usr/bin/clang++ clang++ /usr/bin/clang++-$LLVM_VER_UBUNTU 100 \
            --slave /usr/bin/clang clang /usr/bin/clang-$LLVM_VER_UBUNTU \
            --slave /usr/bin/clang-format clang-format /usr/bin/clang-format-$LLVM_VER_UBUNTU \
            --slave /usr/bin/llvm-symbolizer llvm-symbolizer /usr/bin/llvm-symbolizer-$LLVM_VER_UBUNTU
          sudo update-alternatives --set clang++ /usr/bin/clang++-$LLVM_VER_UBUNTU
          sudo mkdir -p /lib/share
          sudo ln -s /usr/lib/llvm-$LLVM_VER_UBUNTU/share/libc++ /lib/share
          clang++ --version
          clang-format --version

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Conan
        run: |
          pip install --only-binary :all: conan==2.31.1
          conan profile detect --force

      - name: Install cmake-format
        run: "pip install --only-binary :all: cmake-format==0.6.13"

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      # Formatting doesn't vary by build type, so only check it once.
      - name: Check Formatting
        if: matrix.preset == 'dev_ninja_clang_linux'
        run: cmake --build --preset ${{ matrix.preset }} --target clang-format-check

      - name: Check CMake Formatting
        if: matrix.preset == 'dev_ninja_clang_linux'
        run: cmake --build --preset ${{ matrix.preset }} --target cmake-format-check

  build_emscripten:
    name: Build (release_ninja_emscripten)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@65b272e1213f99771fbba0c237e0b3312270e0c9 # v1.13
        with:
          cmake-version: ${{ env.CMAKE_VER }}

      - name: Install Ninja
        uses: seanmiddleditch/gha-setup-ninja@7e868db0f3406270dd46e1dac26c65f621456723 # master
        with:
          version: ${{ env.NINJA_VER }}

      # Sets $EMSDK, which the release_ninja_emscripten preset's
      # toolchainFile points at - see the spike notes in CLAUDE.md for why a
      # real Linux emsdk (not a Windows one) is required.
      - name: Setup emsdk
        uses: emscripten-core/setup-emsdk@6ab9eb1bda2574c4ddb79809fc9247783eaf9021 # v14

      # Building the SDL3 port is lazy (first TU that needs it triggers the
      # build) and its cache-lock isn't safe against multiple ninja jobs
      # hitting that first-use trigger concurrently on a cold cache -
      # confirmed by a real CI failure: "AssertionError: attempt to lock the
      # cache while a parent process is holding the lock". Pre-building it
      # serially, once, before the parallel ninja build avoids the race
      # entirely.
      - name: Pre-build SDL3 port
        run: embuilder build sdl3

      # Needed since imgui became a Conan dependency here too (see
      # cmake/bootstrap_emscripten_conan.cmake) - SDL3 above still comes from
      # Emscripten's own port, not Conan, so this job never needed Conan at
      # all before that.
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Conan
        run: |
          pip install --only-binary :all: conan==2.31.1
          conan profile detect --force

      - name: Configure
        run: cmake --preset release_ninja_emscripten

      - name: Build
        run: cmake --build --preset release_ninja_emscripten
